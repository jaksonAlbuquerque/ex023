<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tabelas</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
      }

      table {
        width: 400px;
        height: 400px;
        border-collapse: collapse;
      }

      td {
        border: 1px solid black;
        padding: 8px;
        text-align: center;
        vertical-align: middle;
      }

      .numero {
        text-align: right;
      }
    </style>
  </head>
  <body>
    <h1>Minha primeira tabela</h1>
    <!-- Hierarquia de tabela (simples)
          TABLE = tabela
            TABLE ROW = linha de tabela
                TABLE HEADER = cabeçalho de tabela
                TABLE DATA = dado de tabela
          -->
    <table>
      <tr>
        <!-- Primeira linha -->
        <td>A1</td>
        <td>B1</td>
        <td>C1</td>
        <td>D1</td>
        <td>E1</td>
        <td>F1</td>
        <td>G1</td>
        <td>H1</td>
      </tr>
      <tr>
        <!-- Segunda linha -->
        <td>A2</td>
        <td>B2</td>
        <td class="numero">C2</td>
        <td>D2</td>
        <td>E2</td>
        <td>F2</td>
        <td>G2</td>
        <td>H2</td>
      </tr>
      <tr>
        <!-- Terceira linha -->
        <td>A3</td>
        <td>B3</td>
        <td class="numero">C3</td>
        <td>D3</td>
        <td>E3</td>
        <td>F3</td>
        <td>G3</td>
        <td>H3</td>
      </tr>
      <tr>
        <!-- Quarta linha -->
        <td>A4</td>
        <td>B4</td>
        <td>C4</td>
        <td>D4</td>
        <td>E4</td>
        <td>F4</td>
        <td>G4</td>
        <td>H4</td>
      </tr>
    </table>
  </body>
</html>
